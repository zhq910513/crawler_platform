name: Build crawler_platform_spiders release
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-register:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: meta
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('RELEASE_MANIFEST.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.REGISTRY }}/crawlers/crawler_platform_spiders" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
      - name: Register immutable SpiderRelease
        env:
          PLATFORM_URL: ${{ secrets.CRAWLER_PLATFORM_URL }}
          CICD_TOKEN: ${{ secrets.CRAWLER_PLATFORM_CICD_TOKEN }}
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.image }}
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          jq -n \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg tag "$IMAGE_TAG" \
            --arg digest "$IMAGE_DIGEST" \
            --arg commit "$GITHUB_SHA" \
            --slurpfile manifest RELEASE_MANIFEST.json \
            '{image_repository:$repository,image_tag:$tag,image_digest:$digest,git_commit:$commit,manifest:$manifest[0]}' \
            > release-request.json
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST "$PLATFORM_URL/api/cicd/spider-releases" \
            --header "X-CICD-Token: $CICD_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @release-request.json
