name: Build and report crawler project
on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: meta
        shell: bash
        run: echo "image=${{ secrets.REGISTRY }}/${{ secrets.IMAGE_REPOSITORY }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
      - name: Parse sch.py and report discovered project
        env:
          PLATFORM_URL: ${{ secrets.CRAWLER_PLATFORM_URL }}
          DISCOVERY_TOKEN: ${{ secrets.CRAWLER_PLATFORM_DISCOVERY_TOKEN }}
          COMPANY_ID: ${{ secrets.CRAWLER_PLATFORM_COMPANY_ID }}
          SERVER_CODE: ${{ secrets.CRAWLER_PLATFORM_SERVER_CODE }}
          IMAGE_REPOSITORY: ${{ steps.meta.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PROJECT_KEY: ${{ vars.PROJECT_KEY || secrets.PROJECT_KEY }}
          PROJECT_CODE: ${{ vars.PROJECT_CODE || secrets.PROJECT_CODE }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || secrets.PROJECT_NAME }}
          RELEASE_CHANNEL: ${{ vars.RELEASE_CHANNEL || 'stable' }}
        shell: bash
        run: |
          python cicd/parse_sch_manifest.py --project-key "$PROJECT_KEY" --project-code "$PROJECT_CODE" --project-name "$PROJECT_NAME" --image-repository "$IMAGE_REPOSITORY" --image-digest "$IMAGE_DIGEST" --release-version "${GITHUB_REF_NAME:-$GITHUB_SHA}" --release-channel "${RELEASE_CHANNEL:-stable}" --repository-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --git-branch "$GITHUB_REF_NAME" --git-commit "$GITHUB_SHA"
          jq -n --argjson companyId "$COMPANY_ID" --arg serverCode "$SERVER_CODE" --slurpfile manifest crawler_manifest.json '{companyId:$companyId,serverCode:$serverCode,manifest:$manifest[0]}' > discovered-project.json
          curl --fail-with-body --retry 3 --retry-all-errors --request POST "$PLATFORM_URL/api/v1/discovered-projects" --header "Authorization: Discovery $DISCOVERY_TOKEN" --header "Content-Type: application/json" --data-binary @discovered-project.json
