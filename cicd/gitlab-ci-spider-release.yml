stages:
  - release

crawler_platform_spider_release:
  stage: release
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    CRAWLER_CONTROL_BASE_URL: "__CRAWLER_CONTROL_BASE_URL__"
    CRAWLER_RELEASE_CHANNEL: "${CRAWLER_RELEASE_CHANNEL:-stable}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache bash curl python3
    - case "$CRAWLER_CONTROL_BASE_URL" in http://*|https://*) ;; *) echo "workflow 未初始化控制端公网回调地址，请从平台 CI一键初始化 页面重新生成 workflow" >&2; exit 2 ;; esac
    - test -n "$CRAWLER_PLATFORM_DISCOVERY_TOKEN"
    - |
      eval "$(python3 - <<'PY'
      import json, os, re, shlex
      meta = {}
      if os.path.exists('crawler_project.json'):
          meta = json.load(open('crawler_project.json', encoding='utf-8'))
      def clean(value):
          return re.sub(r'[^A-Za-z0-9_.-]+', '-', str(value or '')).strip('-_.')
      project_code = clean(os.environ.get('CRAWLER_PROJECT_CODE') or os.environ.get('PROJECT_CODE') or meta.get('projectCode') or meta.get('project_code') or os.environ.get('CI_PROJECT_NAME') or 'crawler-project')
      company_code = clean(os.environ.get('CRAWLER_COMPANY_CODE') or os.environ.get('COMPANY_CODE') or meta.get('companyCode') or meta.get('company_code') or '')
      print('export CRAWLER_PROJECT_CODE=' + shlex.quote(project_code))
      print('export CRAWLER_COMPANY_CODE=' + shlex.quote(company_code))
      PY
      )"
    - if [ -z "$CRAWLER_COMPANY_CODE" ]; then echo "missing crawler_project.json.companyCode or CRAWLER_COMPANY_CODE" >&2; exit 2; fi
    - export CRAWLER_REGISTRY_HOST="${CRAWLER_REGISTRY_HOST:-${CI_REGISTRY:-registry.example.com}}"
    - export CRAWLER_REGISTRY_NAMESPACE="${CRAWLER_REGISTRY_NAMESPACE:-$CI_PROJECT_NAMESPACE}"
    - export IMAGE_REPOSITORY="${CRAWLER_IMAGE_REPOSITORY:-$CRAWLER_REGISTRY_HOST/$CRAWLER_REGISTRY_NAMESPACE/$CRAWLER_PROJECT_CODE}"
    - export IMAGE_REPOSITORY="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
    - if [ -n "$CI_COMMIT_TAG" ]; then export RELEASE_VERSION="${CI_COMMIT_TAG#v}"; elif [ -f VERSION ]; then export RELEASE_VERSION="$(tr -d '[:space:]' < VERSION | sed 's/^v//')"; else echo "missing VERSION or vX.Y.Z tag" >&2; exit 2; fi
    - export CRAWLER_REGISTRY_USERNAME="${CRAWLER_REGISTRY_USERNAME:-${CI_REGISTRY_USER:-}}"
    - export CRAWLER_REGISTRY_PASSWORD="${CRAWLER_REGISTRY_PASSWORD:-${CI_REGISTRY_PASSWORD:-}}"
    - if [ -z "$CRAWLER_REGISTRY_USERNAME" ] || [ -z "$CRAWLER_REGISTRY_PASSWORD" ]; then echo "missing registry credentials: set CRAWLER_REGISTRY_USERNAME/CRAWLER_REGISTRY_PASSWORD, or use GitLab built-in registry variables" >&2; exit 2; fi
    - echo "$CRAWLER_REGISTRY_PASSWORD" | docker login "$CRAWLER_REGISTRY_HOST" -u "$CRAWLER_REGISTRY_USERNAME" --password-stdin
  script:
    - docker build -t "$IMAGE_REPOSITORY:$RELEASE_VERSION" .
    - docker push "$IMAGE_REPOSITORY:$RELEASE_VERSION"
    - export IMAGE_DIGEST="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')"
    - curl -fsSL "$CRAWLER_CONTROL_BASE_URL/api/v1/cicd/spider-release-register.py" -o /tmp/spider_release_register.py
    - python3 /tmp/spider_release_register.py
