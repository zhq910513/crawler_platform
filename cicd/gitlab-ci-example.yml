stages: [build, report]

# 必填 CI/CD 变量：CRAWLER_PLATFORM_URL、CRAWLER_PLATFORM_DISCOVERY_TOKEN、CRAWLER_PLATFORM_COMPANY_ID、CRAWLER_PLATFORM_SERVER_CODE、PROJECT_KEY、PROJECT_CODE、PROJECT_NAME。
# 可选变量：RELEASE_CHANNEL，默认 stable。

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - IMAGE_REF="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE_REF" .
    - docker push "$IMAGE_REF"
    - docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_REF" | sed 's/.*@//' > image_digest.txt
  artifacts:
    paths: [image_digest.txt]

report:
  stage: report
  image: python:3.12-alpine
  dependencies: [build]
  before_script:
    - apk add --no-cache curl jq
  script:
    - test -n "$PROJECT_KEY" && test -n "$PROJECT_CODE" && test -n "$PROJECT_NAME" && test -n "$CRAWLER_PLATFORM_URL" && test -n "$CRAWLER_PLATFORM_DISCOVERY_TOKEN" && test -n "$CRAWLER_PLATFORM_COMPANY_ID" && test -n "$CRAWLER_PLATFORM_SERVER_CODE"
    - DIGEST="$(cat image_digest.txt)"
    - python cicd/parse_sch_manifest.py --project-key "$PROJECT_KEY" --project-code "$PROJECT_CODE" --project-name "$PROJECT_NAME" --image-repository "$CI_REGISTRY_IMAGE" --image-digest "$DIGEST" --release-version "$CI_COMMIT_SHA" --release-channel "${RELEASE_CHANNEL:-stable}" --repository-url "$CI_PROJECT_URL" --git-branch "$CI_COMMIT_REF_NAME" --git-commit "$CI_COMMIT_SHA"
    - jq -n --argjson companyId "$CRAWLER_PLATFORM_COMPANY_ID" --arg serverCode "$CRAWLER_PLATFORM_SERVER_CODE" --slurpfile manifest crawler_manifest.json '{companyId:$companyId,serverCode:$serverCode,manifest:$manifest[0]}' > discovered-project.json
    - curl --fail-with-body --retry 3 --retry-all-errors --request POST "$CRAWLER_PLATFORM_URL/api/v1/discovered-projects" --header "Authorization: Discovery $CRAWLER_PLATFORM_DISCOVERY_TOKEN" --header "Content-Type: application/json" --data-binary @discovered-project.json
