name: crawler_platform

x-backend-common: &backend-common
  build:
    context: ./backend
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
  image: crawler_platform_api:${PLATFORM_IMAGE_TAG:-1.0.86}
  restart: unless-stopped
  env_file: .env
  environment:
    TZ: ${TZ:-Asia/Shanghai}
  networks: [backend]
  logging: &default-logging
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - ./data/redis:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: *default-logging

  migrate:
    <<: *backend-common
    restart: "no"
    command: ["python", "-m", "app.migration_main"]
    depends_on:
      mysql: { condition: service_healthy }

  api:
    <<: *backend-common
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - ./data/task-logs:/data/task-logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 10

  scheduler:
    <<: *backend-common
    command: ["python", "-m", "app.scheduler_main"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  maintenance:
    <<: *backend-common
    command: ["python", "-m", "app.worker_main"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - ./data/task-logs:/data/task-logs

  web:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        APK_MIRROR: ${APK_MIRROR:-mirrors.aliyun.com}
        APP_VERSION: ${APP_VERSION:-1.0.86}
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    image: crawler_platform_web:${PLATFORM_IMAGE_TAG:-1.0.86}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-80}:80"
    networks: [backend]
    logging: *default-logging

networks:
  backend:
    driver: bridge