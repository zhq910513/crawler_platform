# 单机联调/小规模部署：平台 + MySQL + Redis + Web + Agent。
# 生产多服务器场景可只部署 platform compose，再在每台执行服务器安装 Agent。
services:
  agent:
    image: ${AGENT_IMAGE:-crawler_platform_agent:2.1.0}
    container_name: ${AGENT_CONTAINER_NAME:-crawler-agent}
    restart: always
    network_mode: host
    env_file:
      - ./agent/.env.local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AGENT_STATE_DIR:-/var/lib/crawler-agent}:/var/lib/crawler-agent
